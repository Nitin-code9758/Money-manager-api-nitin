spring.application.name=moneymanager

# ===============================
# MySQL Database Configuration
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/moneymanager
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.servlet.context-path=/api/v1.0

# ===============================
# JPA / Hibernate Configuration
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# Email Configuration - Brevo SMTP
# ===============================

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525

spring.mail.username=${BREVO_SMTP_USERNAME}
spring.mail.password=${BREVO_SMTP_PASSWORD}

spring.mail.protocol=smtp

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.from=nitinbro531@gmail.com

# ===============================
# Server Configuration
# ===============================

server.port=8080

# ===============================
# JWT Configuration
# ===============================

jwt.secret=${JWT_SECRET}

money.manager.frontend.url=${FRONTEND_URL}
app.activation.url=${MONEY_MANAGER_BACKEND_URL}

spring.profiles.active=prod